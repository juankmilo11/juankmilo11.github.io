<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under construction</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(24px, 6vw, 56px);
      color: #222;
      background: #fff;
      font: 16px/1.6 "Courier New", monospace;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      text-align: center;
    }

    h1 {
      margin: 0 0 16px;
      font: 700 clamp(1.5rem, 5vw, 2.4rem) Verdana, sans-serif;
    }

    p { margin: 0 0 24px; }

    .gif-construccion {
      display: block;
      width: min(100%, 360px);
      height: auto;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Under construction</h1>
    <p>Esta sección está en construcción.</p>
    <img
      class="gif-construccion"
      src="../../img/enconstruccion.gif"
      alt="Animación de una zona en construcción"
    >
  </main>
</body>
</html>
